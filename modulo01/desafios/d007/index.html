    <picture>
        <source media="(max-width: 750px)" srcset="imagens/paisagem-p.png" type="image/png">

        <img src="imagens/paisagem-g.png" alt="Pessoa em pé no topo de uma montanha, braços abertos, contemplando uma paisagem montanhosa coberta de vegetação sob um céu nublado.">
    </picture>
</p>
